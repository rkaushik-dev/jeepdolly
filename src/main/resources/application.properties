# The service's own settings come from JEEPDOLLY_* environment variables through Settings, and the
# database and the settings are handed to the application when it starts. What is here is only how
# Spring itself should behave.
spring.application.name=jeepdolly
spring.main.banner-mode=off
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
server.error.whitelabel.enabled=false
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
