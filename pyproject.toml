[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeepdolly"
version = "0.1.0"
description = "Oversize and overweight highway permits for a state motor carrier office"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = [
  "SQLAlchemy==2.0.38",
  "alembic==1.14.1",
  "fastapi==0.115.8",
  "pydantic==2.10.6",
  "uvicorn[standard]==0.34.0",
  "click==8.1.8",
]

[project.scripts]
jeepdolly = "jeepdolly.cli.main:run"

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = [
  # Starlette's test client still reaches for an anyio alias anyio has
  # deprecated. Not ours to fix and not worth reading on every run.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# Routes declare their query parameters and bodies as call defaults. That is
# the framework calling convention and there is no other way to write it.
"src/jeepdolly/api/*" = ["B008"]
# A test that a constructor refuses has to evaluate the expression on its own,
# and a test that stands a route up declares its dependencies the way a route
# does, which is as call defaults.
"tests/*" = ["B018", "B008"]
# A migration is generated, and a check constraint is read as one line of SQL.
# Wrapping one makes it harder to compare against the model it came from.
"migrations/*" = ["E501"]
# The environment registers every table by star import, which is the point of it.
"migrations/env.py" = ["E501", "F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["jeepdolly"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
